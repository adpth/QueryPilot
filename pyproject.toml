[project]
name = "querypilot"
version = "0.1.0"
description = "Agentic text-to-SQL with a benchmarked eval harness"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querypilot"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
